version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_server
    environment:
      MYSQL_ROOT_PASSWORD: root  # Cambia esto por una contraseña segura
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/custom.cnf  # Monta el archivo con un nombre específico en conf.d
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
